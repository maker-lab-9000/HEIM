# HEIM deployment settings — copy to config/settings.yaml.
#
# Values written as "dollar-brace VAR" references (see below for the syntax,
# a "-:default" fallback is supported) are read from the environment / .env at
# load time — so this file can usually be copied UNCHANGED, with all deployment
# identity living in .env (see .env.example):
#   HEIM_SERVER_IP, HEIM_PROXMOX_IP, HEIM_HA_IP, HEIM_SSH_USER,
#   HEIM_TELEGRAM_CHAT_ID, HEIM_EMAIL_TO, HEIM_EMAIL_FROM
# Secrets (API keys, tokens, SMTP password) NEVER go in YAML — .env only.

prometheus:
  url: http://${HEIM_SERVER_IP}:9090

# Optional: AI-event stream for the Grafana "Homelab AI Operations" dashboard.
# Remove the block to disable Loki emits entirely.
loki:
  url: http://${HEIM_SERVER_IP}:3100

# Optional: approvals, live command feed, and report pushes over Telegram.
# Bot token comes from env TELEGRAM_BOT_TOKEN. Remove to disable (investigations
# then require --no-approval or approvals.require: false).
telegram:
  chat_id: ${HEIM_TELEGRAM_CHAT_ID}

# Optional: report delivery by email (SMTP). Credentials via env SMTP_USER /
# SMTP_PASSWORD (for Gmail: an app password). Remove to disable email.
email:
  to: ${HEIM_EMAIL_TO}
  from: ${HEIM_EMAIL_FROM}
  smtp_host: smtp.gmail.com
  smtp_port: 465

# Optional: push finished reports into Home Assistant as sensor entities
# (sensor.pam_report_morning / _evening / pam_investigation_<host> — the pam_
# prefix is kept for compatibility with dashboards built for the n8n stack).
# Token via env HA_TOKEN. Remove to disable.
home_assistant:
  url: http://${HEIM_HA_IP}:8123

schedules:
  daily: ["07:00", "22:00"]   # local time, see `timezone`
  poll_minutes: 5             # fast-path alert poller interval
  security_audit: "mon 06:00" # weekly read-only security audit ("" disables). Monday:
                              # Sunday night runs the PVE stop-mode backups and HEIM's own backup.

approvals:
  require: true               # human Telegram approval before any investigation
  approve_timeout_hours: 0    # 0 = wait until you react; >0 = hours, then declined
  outcome_timeout_hours: 8    # no outcome answer -> incident stays flagged (0 = wait)

timezone: Europe/Berlin
db_path: heim.sqlite3         # incident store (SQLite; relative to the working dir)
audit_log: audit.jsonl        # every executed/blocked tool call, one JSON line each
max_concurrent_investigations: 2   # agent runs in flight at once (approval waits don't count)
suppression_days: 90          # default mute window for a false positive (0 = forever)

# Dead-man's switch: a healthchecks.io-style ping URL the daemon GETs after
# every completed poll cycle — the external watchdog that notices when the box
# HEIM itself runs on dies. Empty (the default) disables it.
deadman_url: "${HEIM_DEADMAN_URL:-}"

# Tooling feedback → GitHub issues: the agents' '## Tooling feedback' lines
# become comments on one open issue per tool in this repo ("owner/name"),
# filed by the daemon. Off while empty. Tokens live in .env:
# HEIM_GITHUB_READ_TOKEN (the agents' read-only github_issues tool) and
# HEIM_GITHUB_TOKEN (the daemon's poster).
github:
  repo: "${HEIM_GITHUB_REPO:-}"

# Nightly housekeeping (03:30 local): a WAL-safe SQLite snapshot into
# <db_path dir>/backups/heim-YYYYMMDD.sqlite3, then a retention prune.
backup_keep: 14               # daily snapshots to keep (0 = never rotate)
retention_days: 120           # prune resolved incidents, findings, runs and finished
                              # investigations older than this (0 = keep forever)

# Cost accounting (roadmap §5.6). Model id -> price per MILLION tokens, in
# `currency` below; the ids must match the models in config/agents/*.yaml.
# A model with no entry here is NOT priced: its cost is stored as 0 and the
# dashboard renders an em dash instead of inventing a number.
# EXAMPLE VALUES ONLY — check your provider's current pricing before trusting
# any line you copy from here.
# Model prices for cost accounting, USD per million tokens. Sourced from
# Anthropic's public pricing (verified 2026-10-05) — re-check when providers
# change rates; a model absent here renders as "—", never a guessed number.
model_prices:
  claude-fable-5-1:    { input: 10.00, output: 50.00 }
  claude-fable-5:      { input: 10.00, output: 50.00 }
  claude-opus-5-5:     { input:  4.00, output: 20.00 }
  claude-opus-5:       { input:  5.00, output: 25.00 }
  claude-opus-4-8:     { input:  5.00, output: 25.00 }
  claude-opus-4-7:     { input:  5.00, output: 25.00 }
  claude-opus-4-6:     { input:  5.00, output: 25.00 }
  claude-sonnet-5-5:   { input:  2.00, output: 10.00 }
  claude-sonnet-5:     { input:  2.00, output: 10.00 }
  claude-sonnet-4-6:   { input:  3.00, output: 15.00 }
  claude-haiku-4-5:    { input:  1.00, output:  5.00 }
  # OpenRouter models: put the provider's rate here; free tiers are 0.
  # (OpenRouter /api/v1/models, checked 2026-11-04.)
  deepseek/deepseek-v4.1-flash-1017: { input: 0.15, output: 0.60 }
  google/gemma-4-31b-it:free: { input: 0, output: 0 }
currency: USD                 # "$" for USD, otherwise the bare code ("EUR 0.42")

# Keep the agent's full message history with each investigation — for
# post-morteming wrong RCAs; large (capped at 512 KB per investigation).
# Also the prerequisite for `heim replay <id>`: the stored transcript is the
# cassette an offline replay serves back to another model.
store_transcripts: false

# The models the investigator may run on: offered in the dashboard's
# investigate dropdown, on /agents/investigator (the default for every run)
# and to `heim investigate --model`. Empty = the investigator agent's own
# model only. A plain id means an Anthropic model; OpenRouter or a local
# OpenAI-compatible server take the same {provider, model, base_url} form as
# analyst_models below. Give each a `model_prices` row, or its runs render "—".
# Example:
#   investigator_models:
#     - claude-opus-5-5
#     - {provider: openrouter, model: deepseek/deepseek-v4.1-flash-1017}
investigator_models: []

# The models the dashboard may put in the daily analyst's chain, on
# /agents/daily (pick and order them; "Reset to default" returns to
# config/agents/daily_analyst.yaml). Empty = the chain is shown read-only.
# Give each entry a `model_prices` row, or its runs render "—" for cost.
# Example:
#   analyst_models:
#     - {provider: anthropic, model: claude-opus-5-5}
#     - {provider: openrouter, model: deepseek/deepseek-v4.1-flash-1017}
#     # a local llama.cpp server (OpenAI-compatible API):
#     # - {provider: openai_compat, model: local, base_url: "${HEIM_LLAMACPP_URL:-}"}
analyst_models: []

# Maps Prometheus `instance` label address prefixes to host names — used by the
# alert poller and the daily aggregation to attribute metrics/alerts to hosts.
# Matched in order: put longer / more specific prefixes FIRST. Extend when you
# add hosts.
# The poller matches by STRING prefix, so an address that starts with another
# one's digits (…2 is a prefix of …210, …211, …241) must come before it: keep
# the hypervisor last.
instance_host_map:
  "${HEIM_SERVER_IP}": ubuntu-server
  "${HEIM_HA_IP}": home-assistant
  # The VM HEIM runs on. The name must match the Proxmox guest name for its
  # vmid, or its node_* and pve_* series land on two different hosts.
  "${HEIM_OBSERVABILITY_IP}": heim
  # The LXC containers (CT 110 jellyfin, CT 111 llm; names = PVE guest names).
  # Optional: unset, the entry is dropped. Without them llama-server's scrape
  # target and the containers' Uptime Kuma monitors land on the hypervisor.
  "${HEIM_JELLYFIN_IP:-}": jellyfin
  "${HEIM_LLM_IP:-}": llm
  "${HEIM_PROXMOX_IP}": homelab

# Host badge colors on the dashboard are handed out by position in this list,
# so APPEND a new host rather than inserting it — otherwise every host after
# the insertion point changes color. This is append-only history, not a
# meaningful ordering. Hosts omitted here follow in config order.
host_color_order: [home-assistant, homelab, ubuntu-server, heim, jellyfin, llm]

# Open incidents from metric thresholds (config/queries/daily.yaml warn/crit),
# not just from the Prometheus alert rules. Evaluated on the poller's cadence.
threshold_detection: true
threshold_severity: crit        # crit | warn  (warn also includes crit)
threshold_consecutive: 2        # consecutive polls above threshold before opening

# Uptime Kuma as an alert source: every unpaused monitor is expected up (empty url = off).
# The API key (Uptime Kuma → Settings → API Keys) goes in .env as UPTIME_KUMA.
uptime_kuma:
  url: "${HEIM_UPTIME_KUMA_URL:-}"

name: homelab
role: hypervisor
# Hypervisor findings are investigated from the guest side + the Proxmox API,
# but only in these categories (matches the n8n reconcile gating).
investigable: [cpu, memory, temperature, disk, diskHealth, availability]

api:
  url: https://${HEIM_PROXMOX_IP}:8006   # Proxmox VE API; token via env PROXMOX_TOKEN
  verify_ssl: false

# Injected into the investigator prompt's [FACTS] block.
facts: |
  Disk topology (verified): physical disks are identified by ROLE, never by kernel name — the USB disks re-enumerate at boot, so sda/sdb/… move between drives. Roles (serial-keyed, from the Prometheus recording rule homelab:disk_role:info): 'photos' (SanDisk 2TB SSD, the PVE store 'BigData') holds ubuntu-server's '/Photos' AND the whole disks of the k8s VMs (k8s-cp1/k8s-w1/k8s-w2 = qemu/242–244, plus their template qemu/9000); 'jellymedia' (Transcend 480 GB SSD, PVE store 'JellyMedia') holds ONLY the media library, the host directory /mnt/pve/JellyMedia/media (shared into ubuntu-server as '/JellyMedia' over virtiofs and into the 'jellyfin' container lxc/110 as /media by bind mount); 'system' (512 GB NVMe) holds Proxmox OS + every OTHER VM disk (ubuntu-server '/' and '/docker-data', home-assistant, heim, the LXC containers' root disks); 'raid1-a'/'raid1-b' (two Toshiba HDDs, mdadm RAID1 md0 /toshiba_raid) and 'backup' (Seagate 1 TB) are host-only backup disks with no VM I/O. Resolve which kernel device holds a role RIGHT NOW with: homelab:disk_role:info — never assume a device name from memory. Inside ubuntu-server, identify filesystems by MOUNTPOINT (node_filesystem_* mountpoint label): / and /docker-data sit on 'system'; /Photos is a qcow2 on 'photos'; /JellyMedia is NOT a disk of the VM any more (virtiofs of the host directory above, since 2026-11-11). So 'photos' is heated by /Photos I/O OR by the k8s VMs (split the two with the per-guest pve_disk_* rates of qemu/242–244, whose disks are entirely on 'photos'), and only media reads heat 'jellymedia' — Jellyfin in lxc/110 (pve_disk_read_bytes of lxc/110 does NOT show bind-mount reads; use the host's physical-disk rate below) and Nextcloud through ubuntu-server's '/JellyMedia' — plus host-side backup jobs on either; home-assistant and heim cannot touch them. cAdvisor 'device' labels are GUEST devices, not hypervisor disks. Physical-disk busyness by role: rate(node_disk_written_bytes_total{instance="${HEIM_PROXMOX_IP}:9100"}[5m]) * on(device) group_left(disk) homelab:disk_role:info. The RAID1 Toshibas spin down when idle; SMART gaps for them are normal.
  'jellymedia' is FAILING, known since 2026-11-10 (Reallocated 16, Current_Pending 16, Offline_Uncorrectable 11, UDMA_CRC 185, unchanged after a reseat on 2026-11-11); a replacement is on order and a staging copy of the media lives at /toshiba_raid/jellymedia-staging. Treat those SMART values as the known issue and say so in one line; what matters is whether a counter RISES from them.
  iGPU (since 2026-11-11): the host owns the Ryzen iGPU through amdgpu (no vfio, no VM passthrough). The 'jellyfin' (lxc/110, VA-API transcodes) and 'llm' (lxc/111, llama-server on Vulkan) containers share it through /dev/dri/renderD128 and share its GPU memory (GTT). Metrics from the host's node_exporter drm collector: node_drm_card_info, node_drm_gpu_busy_percent, node_drm_memory_gtt_used_bytes / node_drm_memory_gtt_size_bytes (the 'card' label is a boot-time number, not an identity). Alerts: GpuMissing (card gone: driver failed to load or the GPU hung — Jellyfin falls back to CPU transcoding and llama-server cannot start; on the host, dmesg | grep amdgpu, and a reboot usually fixes it) and GpuGttHigh (GTT above 90%: llama-server's ~3.5 GB model plus transcodes; stopping llm, pct stop 111, frees it). On the host the raw values are /sys/class/drm/card*/device/gpu_busy_percent and mem_info_gtt_used.
  LXC containers: lxc/110 'jellyfin' and lxc/111 'llm' (pve_* with those ids; /nodes/homelab/lxc/<vmid>/status/current). LxcDiskGrowth on lxc/110 is usually the transcode cache in /cache/transcodes.

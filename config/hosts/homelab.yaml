name: homelab
role: hypervisor
# Hypervisor findings are investigated from the guest side + the Proxmox API,
# but only in these categories (matches the n8n reconcile gating).
investigable: [cpu, memory, temperature, disk, diskHealth]

api:
  url: https://${HEIM_PROXMOX_IP}:8006   # Proxmox VE API; token via env PROXMOX_TOKEN
  verify_ssl: false

# Injected into the investigator prompt's [FACTS] block.
facts: |
  Disk topology (verified): physical disks are identified by ROLE, never by kernel name — the USB disks re-enumerate at boot, so sda/sdb/… move between drives. Roles (serial-keyed, from the Prometheus recording rule homelab:disk_role:info): 'photos' (SanDisk 2TB SSD) holds ONLY ubuntu-server's '/Photos'; 'jellymedia' (Transcend 480 GB SSD) holds ONLY '/JellyMedia'; 'system' (512 GB NVMe) holds Proxmox OS + ALL VM virtual disks (ubuntu-server '/' and '/docker-data', home-assistant, monitor-box, heim); 'raid1-a'/'raid1-b' (two Toshiba HDDs, mdadm RAID1 md0 /toshiba_raid) and 'backup' (Seagate 1 TB) are host-only backup disks with no VM I/O. Resolve which kernel device holds a role RIGHT NOW with: homelab:disk_role:info — never assume a device name from memory. Inside ubuntu-server, identify filesystems by MOUNTPOINT (node_filesystem_* mountpoint label): / and /docker-data sit on 'system' like ALL VM disks; /Photos is a qcow2 on 'photos'; /JellyMedia is a qcow2 on 'jellymedia'. So only /Photos I/O heats 'photos', only /JellyMedia heats 'jellymedia' (plus host-side backup jobs); other VMs cannot touch them. cAdvisor 'device' labels are GUEST devices, not hypervisor disks. Physical-disk busyness by role: rate(node_disk_written_bytes_total{instance="${HEIM_PROXMOX_IP}:9100"}[5m]) * on(device) group_left(disk) homelab:disk_role:info. The RAID1 Toshibas spin down when idle; SMART gaps for them are normal.

# The daily trend analyst (port of n8n PAM 10's Basic LLM Chain).
# One completion, no tools; primary model with automatic fallback.
kind: analyst
name: daily_analyst
primary:
  provider: openrouter
  model: google/gemma-4-31b-it:free
fallback:
  provider: anthropic
  model: claude-opus-5-5
# Doubled from 4096: Claude Opus 5.5 always thinks (it cannot be disabled) and
# thinking counts toward max_tokens, while the JSON analysis still has to fit.
max_tokens: 8192
prompt: analyst.md

# The daily trend analyst (port of n8n PAM 10's Basic LLM Chain).
# One completion, no tools. `chain` is tried in order until one model answers
# with parseable analysis JSON; a fallback answer is tagged in the email and on
# the dashboard. The dashboard can override this order (settings.analyst_models
# is its allow-list); this file is the default.
kind: analyst
name: daily_analyst
chain:
  - provider: anthropic
    model: claude-opus-5-5
  - provider: openrouter
    model: deepseek/deepseek-v4.1-flash-1017
  # Last resort: llama-server in CT 111 'llm' (Qwen3-8B on the host iGPU,
  # OpenAI-compatible API; HEIM_LLAMACPP_URL=http://<llm>:8180/v1 and its API
  # key in HEIM_LLAMACPP_KEY). Unset URL = entry dropped. Slow by design: a
  # ~20k-token payload takes ~5 min to read and the JSON ~5-8 min to write,
  # inside a 32k context, so the timeout is 30 min and Qwen3's thinking is off
  # (it would spend the context and the minutes).
  - provider: openai_compat
    model: qwen3-8b
    base_url: ${HEIM_LLAMACPP_URL:-}
    api_key_env: HEIM_LLAMACPP_KEY
    timeout_s: 1800
    # its own budget: the ~27k-token request plus the answer must fit the
    # 32k context (the analyst-wide 16384 below would not)
    max_tokens: 4096
    extra_body:
      chat_template_kwargs: {enable_thinking: false}
# Doubled from 4096: Claude Opus 5.5 always thinks (it cannot be disabled) and
# thinking counts toward max_tokens, while the JSON analysis still has to fit.
# Doubled again on 2026-11-11: DeepSeek spent 6.7k of 8192 tokens reasoning on
# a 27k-token request and was cut off mid-JSON (finish_reason=length).
max_tokens: 16384
prompt: analyst.md

name: loki_query
module: heim.tools.loki_query:LokiQueryTool
description: >-
  Read-only LogQL against the homelab Loki: the systemd journal of homelab (the Proxmox
  hypervisor) and ubuntu-server, plus the docker container logs of ubuntu-server. Use it
  to find WHAT was logged around a finding's onset time (pass 'end' = onset + a few
  minutes and a short lookback). A query starting with '{' returns log lines, newest
  first, with repeats collapsed to one line '×N first→last'; anything else
  (count_over_time, rate, sum by) is a metric query — start there to see WHERE errors
  are, then read lines from that one stream.

  LABELS (exact). Journal: {job="systemd-journal", host="homelab"|"ubuntu-server",
  unit="<name>.service"|"kernel"|"init.scope", level="error"|"warning"|"notice"|"info"|"debug"}.
  Docker (ubuntu-server only): {host="ubuntu-server", container_name="<name>"} with
  compose_project, compose_service and source="stdout"|"stderr" — docker lines have NO
  level label: filter their text with |~ "(?i)error|fatal|panic|exception|traceback".
  Container names = Prometheus' cAdvisor 'name' label (nextcloud-app-1, paperless-webserver-1,
  photoprism-photoprism-1, jellyfin, n8n, browserless, prometheus, loki, …).

  RECIPES. Where are errors (24h): sum by (host, unit) (count_over_time({job="systemd-journal",
  level=~"error|warning"}[24h])). Noisiest containers: sum by (container_name)
  (count_over_time({host="ubuntu-server", container_name=~".+"} |~ "(?i)error|fatal" [6h])).
  One container: {container_name="nextcloud-app-1"} |~ "(?i)error|fatal|exception".
  OOM kills: {unit="kernel"} |~ "(?i)out of memory|oom-kill|killed process".
  Disk/RAID: {host="homelab", unit="kernel"} |~ "(?i)md[0-9]|ata[0-9]|I/O error|reset|data-check|resync".
  Proxmox services: {host="homelab", unit=~"pvedaemon.service|pveproxy.service|pvestatd.service|pve-daily-update.service"}.
  SSH: {host="ubuntu-server", unit="ssh.service"} |~ "Failed|Invalid user|Accepted".
  Docker daemon (container exits/restarts): {host="ubuntu-server", unit=~"docker.service|containerd.service"} |~ "(?i)die|exit|restart|oom".

  NOT IN LOKI: home-assistant (use ha_api /api/error_log), the 11 bitwarden-* containers
  and portainer, and anything before 2026-10-08 (collection start; 90-day retention).
  KNOWN NOISE — not a finding: homelab smartctl-exporter.service 'Device open failed …
  low-power mode' for /dev/sdb and /dev/sdc (the RAID1 Toshibas sleeping; ~16k lines/day —
  exclude with unit!="smartctl-exporter.service"); nextcloud-app-1 'GET /login … Uptime-Kuma'
  health probes; browserless 'Current period usage: {"error":0,…}' counters; the loki
  container echoing the text of queries it ran (level=info … query=…, so a word like
  'error' in someone's query matches — read its level= field); kernel veth/br- 'entered
  forwarding state' lines (a container starting); job="homelab-ai-monitor" (HEIM's own
  events). The journal 'level' is the syslog priority: docker.service and
  smartctl-exporter write their own level=… inside an [info] line, so filter text there too.
args:
  logql:
    type: string
    description: >-
      A LogQL log query ({selector} plus optional |= |~ != !~ line filters) or a metric
      query (count_over_time / rate / sum by over a log query with a [range])
  lookback:
    type: string
    description: "OPTIONAL window before 'end' for log lines, like 15m, 1h, 6h, 2d (max 7d); empty = 1h"
  end:
    type: string
    description: >-
      OPTIONAL ISO-8601 UTC end of the window, e.g. 2026-10-08T09:40:00Z — set it just after
      a finding's onset to read what led up to it; empty = now
  limit:
    type: integer
    description: "OPTIONAL max distinct lines to return (default 50, max 200)"
  step:
    type: string
    description: "OPTIONAL, metric queries only: return a time series at this resolution (e.g. 5m) instead of one value"
required: [logql]
options:
  clip_bytes: 12000

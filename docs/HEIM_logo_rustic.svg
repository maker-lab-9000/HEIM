<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">HEIM logo</title>
  <desc id="desc">Rustic HEIM wordmark with a house integrated into the H, sun, moon, chimney, window and small plants.</desc>

  <!-- Background -->
  <rect width="1200" height="700" fill="#F8F4EA"/>

  <!-- Reusable styling -->
  <defs>
    <style>
      .ink { fill:#3A3632; stroke:#3A3632; }
      .line { fill:none; stroke:#3A3632; stroke-linecap:round; stroke-linejoin:round; }
    </style>
  </defs>

  <!-- SUN -->
  <g class="ink" transform="translate(145 235)">
    <circle cx="0" cy="0" r="29"/>
    <g class="line" stroke-width="12">
      <path d="M0 -58 L0 -78"/>
      <path d="M0 58 L0 78"/>
      <path d="M-58 0 L-78 0"/>
      <path d="M58 0 L78 0"/>
      <path d="M-41 -41 L-56 -56"/>
      <path d="M41 -41 L56 -56"/>
      <path d="M-41 41 L-56 56"/>
      <path d="M41 41 L56 56"/>
    </g>
  </g>

  <!-- MOON -->
  <path fill="#3A3632" d="
    M930,168
    C882,173 846,214 846,263
    C846,315 887,357 938,357
    C964,357 987,347 1004,331
    C971,333 942,311 934,279
    C926,246 941,211 970,193
    C958,176 945,169 930,168 Z"/>

  <!-- HOUSE / H -->
  <!-- H body -->
  <path fill="#3A3632" d="
    M260,330
    Q260,312 278,312
    L320,312
    Q338,312 338,330
    L338,430
    L485,430
    L485,330
    Q485,312 503,312
    L545,312
    Q563,312 563,330
    L563,585
    Q563,603 545,603
    L503,603
    Q485,603 485,585
    L485,500
    L338,500
    L338,585
    Q338,603 320,603
    L278,603
    Q260,603 260,585 Z"/>

  <!-- roof, slightly irregular -->
  <path class="line" stroke-width="24"
        d="M225,328 L408,166 L594,328"/>
  <path class="line" stroke-width="9" opacity="0.95"
        d="M236,321 L409,180 L583,321"/>

  <!-- chimney -->
  <path fill="#F8F4EA" stroke="#3A3632" stroke-width="10" stroke-linejoin="round"
        d="M500,172 L500,250 L554,250 L554,172 Z"/>
  <path class="line" stroke-width="10" d="M493,170 L561,170"/>
  <path class="line" stroke-width="7" d="M516,190 L538,190"/>

  <!-- window -->
  <g fill="#3A3632">
    <rect x="381" y="270" width="34" height="34" rx="5"/>
    <rect x="423" y="270" width="34" height="34" rx="5"/>
    <rect x="381" y="312" width="34" height="34" rx="5"/>
    <rect x="423" y="312" width="34" height="34" rx="5"/>
  </g>

  <!-- EIM wordmark -->
  <text x="590" y="600"
        fill="#3A3632"
        font-size="280"
        font-family="Arial Rounded MT Bold, Nunito, Avenir Next, Arial, sans-serif"
        font-weight="800"
        letter-spacing="2">EIM</text>

  <!-- Ground accents -->
  <g class="line" stroke-width="8">
    <path d="M215,607 C235,597 252,597 270,607"/>
    <path d="M326,610 C342,598 357,598 370,610"/>
    <path d="M468,611 C484,598 500,598 514,611"/>
  </g>

  <!-- Left plant -->
  <g class="line" stroke-width="7">
    <path d="M226,598 C224,565 225,531 232,500"/>
    <path d="M230,535 C211,522 200,504 198,488"/>
    <path d="M229,552 C246,539 258,524 264,507"/>
    <path d="M230,575 C212,565 200,552 194,539"/>
  </g>
  <g fill="#3A3632">
    <ellipse cx="196" cy="484" rx="9" ry="18" transform="rotate(-35 196 484)"/>
    <ellipse cx="265" cy="503" rx="9" ry="18" transform="rotate(35 265 503)"/>
    <ellipse cx="192" cy="536" rx="8" ry="16" transform="rotate(-42 192 536)"/>
  </g>

  <!-- Small grasses -->
  <g class="line" stroke-width="6">
    <path d="M286,604 L280,580"/>
    <path d="M292,605 L299,579"/>
    <path d="M306,604 L312,586"/>
    <path d="M522,604 L516,581"/>
    <path d="M532,604 L541,579"/>
  </g>
</svg>

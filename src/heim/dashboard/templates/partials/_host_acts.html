{% import "partials/_macros.html" as m with context %}
{%- set e = (inflight or {}).get('host', {}).get(host) %}
<div class="acts">
  {%- if e %}
  {{ m.inflight(e) }}
  {%- else %}
  {{ m.act('/actions/investigate', 'Investigate', {'host': host}, model=true) }}
  {%- endif %}
  {% include "partials/_flash.html" %}
</div>

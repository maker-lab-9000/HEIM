{% extends "base.html" %}
{% block content %}

<form class="filters" method="get" action="/investigations"
      hx-get="/investigations/rows" hx-target="#inv-rows" hx-swap="outerHTML"
      hx-trigger="change">
  <label>status
    <select name="status">
      <option value="">any</option>
      {%- for s in filters.statuses %}
      <option value="{{ s }}"{{ ' selected' if s == filters.status }}>{{ s|replace('_', ' ') }}</option>
      {%- endfor %}
    </select>
  </label>
  <label>host
    <select name="host">
      <option value="">any</option>
      {%- for h in filters.hosts %}
      <option value="{{ h }}"{{ ' selected' if h == filters.host }}>{{ h }}</option>
      {%- endfor %}
    </select>
  </label>
  <label>trigger
    <select name="trigger">
      <option value="">any</option>
      {%- for t in filters.triggers %}
      <option value="{{ t }}"{{ ' selected' if t == filters.trigger }}>{{ t }}</option>
      {%- endfor %}
    </select>
  </label>
  <button type="submit">Apply</button>
  {%- if filters.query %}<a class="clear" href="/investigations">Clear</a>{% endif %}
</form>

<section class="card">
  <table class="tbl dense">
    <thead><tr>
      <th scope="col" class="c-id">id</th>
      <th scope="col">status</th>
      <th scope="col">trigger</th>
      <th scope="col">host</th>
      <th scope="col">fingerprint</th>
      <th scope="col" class="num">steps</th>
      <th scope="col" class="num">tokens</th>
      <th scope="col" class="num">duration</th>
      <th scope="col">started</th>
    </tr></thead>
    {% set query = filters.query %}
    {% include "partials/_inv_rows.html" %}
  </table>
</section>
{% endblock %}

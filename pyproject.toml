[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heim"
version = "0.1.0"
description = "HEIM — Homelab Event & Incident Monitor: AI health reports and approval-gated root-cause investigations for a homelab (standalone port of the n8n PAM stack)"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "httpx>=0.27",
    "pyyaml>=6",
    "pydantic>=2",
    "jinja2>=3.1",
    "markdown>=3.5",
    "asyncssh>=2.14",
    "apscheduler>=3.10,<4",
    "python-dotenv>=1.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
heim = "heim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
heim = [
    "reports/templates/*",
    "dashboard/templates/*",
    "dashboard/templates/partials/*",
    "dashboard/static/*",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
